<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechFest 2026 - Registration</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>TechFest 2026</h1>
        <p>Participant Registration</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="events.html">Events</a>
        <a href="schedule.html">Schedule</a>
        <a href="results.html">Results</a>
        <a href="register.html">Register</a>
        <a href="gallery.html">Gallery</a>
        <a href="contact.html">Contact</a>
        <a href="faq.html">FAQ</a>
    </nav>

    <main>

        <section class="form-section">

            <h2>Participant Registration Form</h2>

            <form>

                <!-- 1. Text Input -->
                <label for="name">Full Name:</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    required
                    minlength="3">

                <!-- 2. Email -->
                <label for="email">Email Address:</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="example@gmail.com"
                    required>

                <!-- 3. Phone -->
                <label for="phone">Phone Number:</label>
                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="10 digit phone number"
                    pattern="[0-9]{10}"
                    required>

                <!-- 4. Date -->
                <label for="dob">Date of Birth:</label>
                <input
                    type="date"
                    id="dob"
                    name="dob"
                    required>

                <!-- 5. Number -->
                <label for="semester">Semester:</label>
                <input
                    type="number"
                    id="semester"
                    name="semester"
                    min="1"
                    max="8"
                    required>

                <!-- 6. Dropdown -->
                <label for="college">College:</label>
                <select id="college" name="college" required>

                    <option value="">Select College</option>
                    <option value="abc">ABC College</option>
                    <option value="xyz">XYZ College</option>
                    <option value="pqr">PQR Institute</option>
                    <option value="other">Other</option>

                </select>

                <!-- 7. Dropdown -->
                <label for="event">Select Event:</label>
                <select id="event" name="event" required>

                    <option value="">Choose an event</option>
                    <option value="coding">Coding Challenge</option>
                    <option value="quiz">Tech Quiz</option>
                    <option value="photography">Photography Contest</option>
                    <option value="singing">Singing Competition</option>

                </select>

                <!-- 8. Radio Buttons -->
                <fieldset>

                    <legend>Gender</legend>

                    <label>
                        <input
                            type="radio"
                            name="gender"
                            value="male"
                            required>
                        Male
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="gender"
                            value="female">
                        Female
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="gender"
                            value="other">
                        Other
                    </label>

                </fieldset>

                <!-- 9. Checkboxes -->
                <fieldset>

                    <legend>Facilities Required</legend>

                    <label>
                        <input
                            type="checkbox"
                            name="food"
                            value="yes">
                        Food
                    </label>

                    <label>
                        <input
                            type="checkbox"
                            name="accommodation"
                            value="yes">
                        Accommodation
                    </label>

                    <label>
                        <input
                            type="checkbox"
                            name="transport"
                            value="yes">
                        Transportation
                    </label>

                </fieldset>

                <!-- 10. File Upload -->
                <label for="idcard">Upload College ID:</label>
                <input
                    type="file"
                    id="idcard"
                    name="idcard"
                    accept=".jpg,.jpeg,.png,.pdf"
                    required>

                <!-- 11. Color -->
                <label for="color">Favourite Event Theme Color:</label>
                <input
                    type="color"
                    id="color"
                    name="color">

                <!-- 12. Time -->
                <label for="arrival">Expected Arrival Time:</label>
                <input
                    type="time"
                    id="arrival"
                    name="arrival">

                <!-- 13. Textarea -->
                <label for="message">Additional Information:</label>
                <textarea
                    id="message"
                    name="message"
                    rows="4"
                    placeholder="Enter any additional information">
                </textarea>

                <!-- 14. Agreement Checkbox -->
                <label>
                    <input
                        type="checkbox"
                        name="agreement"
                        required>
                    I agree to the event rules and regulations.
                </label>

                <br>

                <button type="submit">Submit Registration</button>

                <button type="reset">Reset Form</button>

            </form>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 TechFest. All Rights Reserved.</p>
    </footer>

</body>
</html>
